version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/app
      # 変更点: カレントディレクトリの staticfiles フォルダをマウント
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn myproject.wsgi:application --bind 0.0.0.0:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=myproject.settings
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # 変更点: Nginxもカレントディレクトリの同じフォルダを見る
      - ./staticfiles:/app/staticfiles:ro
      - ./stock_analyzer:/app/stock_analyzer
    depends_on:
      - app

# 下の volumes 定義は不要になったので削除します
# volumes:
#   static_volume: