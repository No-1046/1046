{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ニュース収集・感情分析システム</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'stock_analyzer/css/style.css' %}">
</head>
<body data-bs-theme="dark" class="text-light">

<div style="display:none;">
  {% csrf_token %}
</div>

<div class="container my-4 my-md-5">
  
  <header class="mb-5 border-bottom border-secondary pb-3">
    <h1 class="display-6 fw-bold">📰 ニュース収集・感情分析</h1>
    <a href="{% url 'stock_analyzer:index' %}" class="btn btn-primary btn-lg">チャート分析</a>
    <p class="text-secondary">Google Newsの収集とGeminiによる感情スコアリングを実行します。</p>
  </header>

  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card bg-dark-subtle border-secondary h-100">
        <div class="card-header border-secondary fw-bold">⚙️ 設定・実行</div>
        <div class="card-body">
          <div class="mb-3">
            <label for="paramCompany" class="form-label text-muted small">会社名 (例: Nintendo)</label>
            <input type="text" id="paramCompany" class="form-control" placeholder="Nintendo" value="Nintendo">
          </div>
          
          <div class="mb-3">
            <label for="paramTicker" class="form-label text-muted small">銘柄コード (例: 7974)</label>
            <input type="text" id="paramTicker" class="form-control" placeholder="7974" value="7974">
          </div>

          <div class="mb-4">
            <label for="paramDays" class="form-label text-muted small">収集期間 (過去N日)</label>
            <input type="number" id="paramDays" class="form-control" value="3" min="1" max="30">
          </div>

          <div class="d-grid gap-2">
            <button class="btn btn-primary" onclick="runCrawl()">
              🚀 1. ニュース収集 (Crawl)
            </button>
            <button class="btn btn-success" onclick="runAnalyze()">
              🧠 2. 感情分析 (Analyze)
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card bg-black border-secondary h-100">
        <div class="card-header border-secondary bg-transparent d-flex justify-content-between align-items-center">
          <span class="fw-bold text-light">🖥️ コンソール出力</span>
          <span id="statusIndicator" class="badge bg-secondary">待機中</span>
        </div>
        <div class="card-body p-0">
          <div id="result" class="p-3 font-monospace text-success" style="height: 300px; overflow-y: auto; white-space: pre-wrap; font-size: 0.9rem;">ログがここに表示されます...</div>
        </div>
        <div class="card-footer border-secondary bg-transparent text-end">
             <a href="{% url 'news_analyzer:dashboard' %}" class="btn btn-outline-info btn-sm">📊 ダッシュボードへ移動</a>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-5">
    <div class="accordion" id="accordionDiag">
      <div class="accordion-item bg-dark-subtle border-secondary">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed bg-dark-subtle text-light" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDiag">
            🛠️ システム診断・既存データ確認
          </button>
        </h2>
        <div id="collapseDiag" class="accordion-collapse collapse" data-bs-parent="#accordionDiag">
          <div class="accordion-body">
            <div class="d-flex gap-2 mb-3">
               <button class="btn btn-sm btn-outline-secondary" onclick="listCompanies()">📂 フォルダ一覧更新</button>
               <button class="btn btn-sm btn-outline-secondary" onclick="showDiag()">🩺 環境診断</button>
            </div>
            <pre id="diagResult" class="bg-black text-warning p-3 rounded border border-secondary small"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="{% static 'news_analyzer/js/script.js' %}"></script>

</body>
</html>
