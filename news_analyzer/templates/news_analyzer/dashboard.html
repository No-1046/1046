{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>感情分析ダッシュボード</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'stock_analyzer/css/style.css' %}">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body data-bs-theme="dark" class="text-light">

<div class="container-fluid px-4 my-4">
  
  <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
    <h1 class="h3 fw-bold m-0">📊 感情分析ダッシュボード</h1>
    <a href="{% url 'news_analyzer:index' %}" class="btn btn-outline-secondary btn-sm">← 戻る</a>
  </header>

  <div class="card bg-dark-subtle border-secondary mb-4 h-50">
    <div class="card-body py-3 ">
      <div class="row align-items-center g-3">
        <div class="col-md-auto">
          <label class="form-label text-muted small mb-1">対象企業フォルダ</label>
          <select id="companySelect" class="form-select form-select-sm" style="min-width: 200px;">
            <option value="">(読み込み中...)</option>
          </select>
        </div>
      <div class="col-md-auto">
        <label class="form-label text-muted small mb-1">
          <small class="text-info"></small>
        </label>
      </div>
        <div class="col text-end align-self-end">
            <button class="btn btn-sm btn-primary" onclick="loadSelectedCompany()">再描画</button>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-8">
      <div class="card bg-dark-subtle border-secondary h-200">
        <div class="card-header border-secondary fw-bold">📈 時系列推移 (感情スコア vs 株価)</div>
        <div class="card-body p-2">
            <div id="chart" style="width:100%; height:500px;"></div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card bg-dark-subtle border-secondary h-150">
        <div class="card-header border-secondary fw-bold">📰 主要ニュース (Sentiment Top/Bottom 5)</div>
        📰 ニュース表示日
        <select id="dateSelect" class="form-select form-select-sm" style="min-width: 180px;">
          <option value="">(日付を選択)</option>
        </select>
        <div class="card-body overflow-auto" style="max-height: 520px;">
          <div id="headlines">
            <p class="text-muted small text-center mt-5">日付を選択するとここにニュースが表示されます</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.plot.ly/plotly-2.20.0.min.js"></script> <script src="{% static 'news_analyzer/js/script.js' %}"></script>


</body>
</html>
